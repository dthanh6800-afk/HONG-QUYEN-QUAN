services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: tea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: tea
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - tea_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tea"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  tea_data:
